<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <filter id="engraved">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Shield / Medallion -->
  <rect width="512" height="512" rx="64" fill="url(#vignette)"/>
  
  <!-- Outer Filigree Border -->
  <rect x="24" y="24" width="464" height="464" rx="48" fill="none" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="36" y="36" width="440" height="440" rx="40" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>

  <!-- Ornate Corner Embellishments -->
  <g stroke="#e4e4e7" stroke-width="2" fill="none">
    <!-- Top-Left -->
    <path d="M 44 80 C 60 80, 80 60, 80 44 M 44 96 C 70 96, 96 70, 96 44"/>
    <!-- Top-Right -->
    <path d="M 468 80 C 452 80, 432 60, 432 44 M 468 96 C 442 96, 416 70, 416 44"/>
    <!-- Bottom-Left -->
    <path d="M 44 432 C 60 432, 80 452, 80 468 M 44 416 C 70 416, 96 442, 96 468"/>
    <!-- Bottom-Right -->
    <path d="M 468 432 C 452 432, 432 452, 432 468 M 468 416 C 442 416, 416 442, 416 468"/>
  </g>

  <!-- Royal Victorian Laurel Wreath (Silver/Ivory) -->
  <g stroke="#71717a" stroke-width="1.5" fill="none" opacity="0.6">
    <circle cx="256" cy="256" r="180"/>
    <circle cx="256" cy="256" r="172" stroke-dasharray="3 6"/>
  </g>

  <!-- Intertwined V and J Victorian Monogram -->
  <g filter="url(#engraved)">
    <!-- Letter V: Stately Gothic Calligraphic Serif Form -->
    <path d="M 145 130 
             C 175 130, 195 140, 205 165
             L 256 360
             L 307 165
             C 317 140, 337 130, 367 130
             L 367 145
             C 342 145, 332 155, 322 180
             L 266 385
             C 260 405, 252 405, 246 385
             L 190 180
             C 180 155, 170 145, 145 145
             Z" 
          fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/>

    <!-- Letter J: Elegant Curved Stem Intersecting the V -->
    <path d="M 285 130
             C 310 130, 330 135, 345 145
             L 335 165
             C 325 155, 310 150, 295 150
             L 295 330
             C 295 385, 275 425, 215 425
             C 175 425, 150 395, 150 365
             C 150 345, 165 335, 180 335
             C 195 335, 205 345, 205 360
             C 205 380, 195 390, 185 390
             C 195 405, 210 408, 225 408
             C 260 408, 272 375, 272 325
             L 272 150
             L 255 150
             L 255 130
             Z" 
          fill="#e4e4e7" fill-opacity="0.95" stroke="#09090b" stroke-width="2"/>
  </g>

  <!-- Crown / Diadem on Top of Monogram -->
  <g fill="#f4f4f5" stroke="#27272a" stroke-width="1">
    <path d="M 226 105 L 236 82 L 256 94 L 276 82 L 286 105 Z"/>
    <circle cx="236" cy="80" r="3.5" fill="#f4f4f5"/>
    <circle cx="256" cy="74" r="4.5" fill="#f4f4f5"/>
    <circle cx="276" cy="80" r="3.5" fill="#f4f4f5"/>
  </g>

  <!-- Small Elegant Ribbon Text at Bottom -->
  <text x="256" y="458" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16" letter-spacing="6" fill="#a1a1aa" text-anchor="middle" font-weight="600">
    VESTA
  </text>
</svg>
